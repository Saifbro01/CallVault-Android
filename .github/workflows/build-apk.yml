name: Build CallVault Android APK (Universal & Samsung A13)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Universal Android APK (Cloud Runner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant Execute Permissions
        run: |
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Build Release APK
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Collect Universal & Device APKs
        run: |
          mkdir -p apk-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Packaging APK: $APK_FILE"
            cp -v "$APK_FILE" apk-output/CallVault-Universal-Android.apk
            cp -v "$APK_FILE" apk-output/CallVault-Samsung-Galaxy-A13.apk
            cp -v "$APK_FILE" apk-output/CallVault-OPPO-F19.apk
          else
            echo "Error: No APK built"
            exit 1
          fi
          ls -lh apk-output/

      - name: Upload Universal APK (For Samsung A13 & All Android Phones)
        uses: actions/upload-artifact@v4
        with:
          name: CallVault-Universal-Android-APK
          path: apk-output/CallVault-Universal-Android.apk
          retention-days: 30

      - name: Upload Samsung Galaxy A13 APK
        uses: actions/upload-artifact@v4
        with:
          name: CallVault-Samsung-Galaxy-A13-APK
          path: apk-output/CallVault-Samsung-Galaxy-A13.apk
          retention-days: 30

      - name: Upload All Variants
        uses: actions/upload-artifact@v4
        with:
          name: CallVault-All-Android-APKs
          path: apk-output/
          retention-days: 30
